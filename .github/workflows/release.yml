name: Release
on:
  push: { branches: [main] }
  # Run by hand to finish a release whose publish step failed. Each step skips what's already done.
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when merging a release PR creates a release. No stored tokens: npm trusted publishing
  # and the MCP Registry both accept this workflow's GitHub identity (id-token). One-time setup on
  # npmjs.com: package settings → Trusted publisher → GitHub Actions, har5h98/crm-lifecycle-ops, release.yml.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      # Pinned: this job holds a publishing identity, so nothing it runs should change without a commit.
      # Trusted publishing needs npm 11.5+; 12.2.2 published 0.5.3.
      - run: npm install -g npm@12.2.2
      - run: npm ci
      - run: npm run check
      - name: Publish to npm (skipped if this version is already there)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "crm-lifecycle-ops@$v" version >/dev/null 2>&1; then echo "$v is already on npm"; else npm publish --access public --provenance; fi
      # npm takes a minute or two to serve a new version, and the MCP Registry checks npm before accepting it.
      - name: Wait until npm serves the new version
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 36); do
            if npm view "crm-lifecycle-ops@$v" version >/dev/null 2>&1; then echo "npm serves $v"; exit 0; fi
            sleep 10
          done
          echo "::error::npm still doesn't serve $v after 6 minutes"; exit 1
      - name: Publish to the MCP Registry (skipped if this version is already listed)
        run: |
          v=$(node -p "require('./package.json').version")
          if curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=crm-lifecycle-ops" \
            | jq -e --arg v "$v" '[.servers[] | (.server // .) | select(.version == $v)] | length > 0' >/dev/null; then
            echo "$v is already in the MCP Registry"; exit 0
          fi
          # Pinned with its checksum (GitHub's asset digest). To upgrade: gh api repos/modelcontextprotocol/registry/releases/latest
          curl -sSfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz"
          echo "09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
