name: Release
on:
  push: { branches: [main] }
permissions: { contents: write, pull-requests: write }
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when merging a release PR creates a release. No stored tokens: npm trusted publishing
  # and the MCP Registry both accept this workflow's GitHub identity (id-token). One-time setup on
  # npmjs.com: package settings → Trusted publisher → GitHub Actions, har5h98/crm-lifecycle-ops, release.yml.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
      - name: Publish to the MCP Registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
